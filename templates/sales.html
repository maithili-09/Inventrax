<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sales | Inventrax</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div id="appNav"></div>

<main class="app-main">

<div class="container-fluid px-lg-5">

<div class="page-header">

<div>

<span class="eyebrow">REVENUE ACTIVITY</span>

<h1>Sales</h1>

<p>
Record sales and let Inventrax update stock automatically.
</p>

</div>

<button
class="btn btn-primary rounded-pill"
data-bs-toggle="modal"
data-bs-target="#salesModal">

<i class="bi bi-plus-lg me-2"></i>
Record Sale

</button>

</div>


<div class="search-panel">

<div class="search-box">

<i class="bi bi-search"></i>

<input
id="salesSearch"
type="search"
placeholder="Search sales by product name...">

</div>

</div>


<div class="data-card">

<div class="table-responsive">

<table class="table modern-table">

<thead>

<tr>

<th>Product</th>
<th>Quantity</th>
<th>Unit Price</th>
<th>Total</th>
<th>Date & Time</th>

</tr>

</thead>

<tbody id="salesTable"></tbody>

</table>

</div>

<div id="salesPagination"
class="pagination-area">
</div>

</div>

</div>

</main>


<div class="modal fade"
id="salesModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content dark-modal">

<div class="modal-header">

<h5>Record Sale</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="salesForm">

<div class="mb-3">

<label>Product Name</label>

<input
id="salesProduct"
class="form-control"
required>

</div>

<div class="row g-3">

<div class="col-md-6">

<label>Quantity</label>

<input
id="salesQuantity"
type="number"
min="1"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Unit Price</label>

<input
id="salesPrice"
type="number"
min="0"
step="0.01"
class="form-control"
required>

</div>

</div>


<div class="mt-3">

<label>Total Amount</label>

<input
id="salesTotal"
class="form-control"
readonly>

</div>


<div class="modal-footer px-0 pb-0 mt-4">

<button
type="button"
class="btn btn-secondary rounded-pill"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-primary rounded-pill">

Record Sale

</button>

</div>

</form>

</div>

</div>

</div>

</div>


<div id="toastContainer"></div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/static/script.js"></script>

</body>
</html>
