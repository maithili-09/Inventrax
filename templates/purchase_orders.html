<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Purchase Orders | Inventrax</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div id="appNav"></div>

<main class="app-main">

<div class="container-fluid px-lg-5">

<div class="page-header">

<div>

<span class="eyebrow">PROCUREMENT</span>

<h1>Purchase Orders</h1>

<p>Track purchasing activity and incoming inventory.</p>

</div>

<button
class="btn btn-primary rounded-pill"
data-bs-toggle="modal"
data-bs-target="#purchaseModal">

<i class="bi bi-plus-lg me-2"></i>
New Order

</button>

</div>


<div class="search-panel">

<div class="search-box">

<i class="bi bi-search"></i>

<input
id="purchaseSearch"
type="search"
placeholder="Search supplier, product or order status...">

</div>

</div>


<div class="data-card">

<div class="table-responsive">

<table class="table modern-table">

<thead>

<tr>

<th>Supplier</th>
<th>Product</th>
<th>Quantity</th>
<th>Unit Price</th>
<th>Total</th>
<th>Status</th>
<th>Date</th>

</tr>

</thead>

<tbody id="purchaseTable"></tbody>

</table>

</div>

<div id="purchasePagination"
class="pagination-area">
</div>

</div>

</div>

</main>


<div class="modal fade"
id="purchaseModal">

<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content dark-modal">

<div class="modal-header">

<h5>New Purchase Order</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="purchaseForm">

<div class="row g-3">

<div class="col-md-6">

<label>Supplier</label>

<input
id="purchaseSupplier"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Product</label>

<input
id="purchaseProduct"
class="form-control"
required>

</div>

<div class="col-md-4">

<label>Quantity</label>

<input
id="purchaseQuantity"
type="number"
min="1"
class="form-control"
required>

</div>

<div class="col-md-4">

<label>Unit Price</label>

<input
id="purchasePrice"
type="number"
min="0"
step="0.01"
class="form-control"
required>

</div>

<div class="col-md-4">

<label>Total</label>

<input
id="purchaseTotal"
class="form-control"
readonly>

</div>

<div class="col-md-12">

<label>Status</label>

<select
id="purchaseStatus"
class="form-select">

<option>Pending</option>
<option>Received</option>
<option>Cancelled</option>

</select>

</div>

</div>

<div class="modal-footer px-0 pb-0 mt-4">

<button
type="button"
class="btn btn-secondary rounded-pill"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-primary rounded-pill">

Save Order

</button>

</div>

</form>

</div>

</div>

</div>

</div>


<div id="toastContainer"></div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/static/script.js"></script>

</body>
</html>
