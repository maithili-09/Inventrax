<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create an Inventrax account.">

    <title>Register | Inventrax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body class="auth-page">

<div class="auth-wrapper">

    <div class="auth-brand">

        <a href="/">
            <img src="/static/images/logo.svg"
                 alt="Inventrax Logo">
        </a>

        <span>Inventrax</span>

    </div>


    <div class="auth-card">

        <span class="eyebrow">
            CREATE WORKSPACE
        </span>

        <h1>Start with Inventrax.</h1>

        <p>
            Create your business account and start managing stock.
        </p>


        <form id="registerForm">

            <div class="form-floating mb-3">

                <input
                    type="email"
                    class="form-control"
                    id="registerEmail"
                    placeholder="Email"
                    required>

                <label for="registerEmail">
                    Email address
                </label>

            </div>


            <div class="form-floating mb-3">

                <input
                    type="password"
                    class="form-control"
                    id="registerPassword"
                    placeholder="Password"
                    minlength="6"
                    required>

                <label for="registerPassword">
                    Password
                </label>

            </div>


            <div class="form-floating mb-3">

                <input
                    type="password"
                    class="form-control"
                    id="registerConfirm"
                    placeholder="Confirm password"
                    minlength="6"
                    required>

                <label for="registerConfirm">
                    Confirm password
                </label>

            </div>


            <button
                class="btn btn-primary btn-lg w-100 rounded-pill"
                type="submit">

                Create Account
                <i class="bi bi-person-plus ms-2"></i>

            </button>

        </form>


        <p class="auth-bottom">

            Already registered?

            <a href="/login">
                Sign in
            </a>

        </p>

    </div>

</div>


<div id="toastContainer"></div>

<script src="/static/script.js"></script>

</body>
</html>
