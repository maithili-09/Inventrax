<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Login to Inventrax inventory management system.">

    <title>Login | Inventrax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body class="auth-page">

<div class="auth-wrapper">

    <div class="auth-brand">

        <a href="/">
            <img src="/static/images/logo.svg"
                 alt="Inventrax Logo">
        </a>

        <span>Inventrax</span>

    </div>


    <div class="auth-card">

        <span class="eyebrow">
            SECURE ACCESS
        </span>

        <h1>Welcome back.</h1>

        <p>
            Sign in to manage your inventory workspace.
        </p>


        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-floating mb-3">

                <input
                    type="email"
                    class="form-control"
                    id="loginEmail"
                    placeholder="Email"
                    required>

                <label for="loginEmail">
                    Email address
                </label>

            </div>


            <!-- PASSWORD -->

            <div class="input-group mb-3">

                <div class="form-floating">

                    <input
                        type="password"
                        class="form-control"
                        id="loginPassword"
                        placeholder="Password"
                        required>

                    <label for="loginPassword">
                        Password
                    </label>

                </div>

                <button
                    type="button"
                    class="btn btn-outline-secondary password-toggle"
                    id="toggleLoginPassword"
                    aria-label="Show password">

                    <i class="bi bi-eye"
                       id="loginPasswordIcon">
                    </i>

                </button>

            </div>


            <button
                class="btn btn-primary btn-lg w-100 rounded-pill"
                type="submit">

                Sign In
                <i class="bi bi-arrow-right ms-2"></i>

            </button>

        </form>


        <p class="auth-bottom">

            New to Inventrax?

            <a href="/register">
                Create an account
            </a>

        </p>

    </div>

</div>


<div id="toastContainer"></div>


<script src="/static/script.js"></script>


<!-- Password Show / Hide -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const password =
        document.getElementById("loginPassword");

    const toggleButton =
        document.getElementById("toggleLoginPassword");

    const passwordIcon =
        document.getElementById("loginPasswordIcon");


    if (password && toggleButton && passwordIcon) {

        toggleButton.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                passwordIcon.classList.remove("bi-eye");

                passwordIcon.classList.add("bi-eye-slash");

                toggleButton.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                password.type = "password";

                passwordIcon.classList.remove("bi-eye-slash");

                passwordIcon.classList.add("bi-eye");

                toggleButton.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        });

    }

});

</script>


</body>
</html>
