<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stock | Inventrax</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link rel="stylesheet"
      href="/static/style.css">

</head>

<body>

<div id="appNav"></div>


<main class="app-main">

<div class="container-fluid px-lg-5">

<div class="page-header">

<div>

<span class="eyebrow">
INVENTORY CONTROL
</span>

<h1>Stock Management</h1>

<p>
Manage products, quantities, pricing and stock thresholds.
</p>

</div>

<button
class="btn btn-primary rounded-pill"
data-bs-toggle="modal"
data-bs-target="#stockModal">

<i class="bi bi-plus-lg me-2"></i>
Add Product

</button>

</div>


<div class="search-panel">

<div class="search-box">

<i class="bi bi-search"></i>

<input
type="search"
id="stockSearch"
placeholder="Search 1,000+ products by name or category...">

</div>

</div>


<div class="data-card">

<div class="table-responsive">

<table class="table modern-table">

<thead>

<tr>

<th>Product</th>
<th>Category</th>
<th>Quantity</th>
<th>Price</th>
<th>Minimum</th>
<th>Status</th>

</tr>

</thead>

<tbody id="stockTable"></tbody>

</table>

</div>


<div id="stockPagination"
     class="pagination-area">
</div>

</div>

</div>

</main>


<div class="modal fade"
     id="stockModal">

<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content dark-modal">

<div class="modal-header">

<h5 class="modal-title">
Add / Update Product
</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>


<div class="modal-body">

<form id="stockForm">

<div class="row g-3">

<div class="col-md-6">

<label>Product Name</label>

<input
id="productName"
class="form-control"
required>

</div>


<div class="col-md-6">

<label>Category</label>

<input
id="productCategory"
class="form-control"
required>

</div>


<div class="col-md-4">

<label>Quantity</label>

<input
id="productQuantity"
type="number"
min="0"
class="form-control"
required>

</div>


<div class="col-md-4">

<label>Price</label>

<input
id="productPrice"
type="number"
min="0"
step="0.01"
class="form-control"
required>

</div>


<div class="col-md-4">

<label>Minimum Stock</label>

<input
id="productMinimum"
type="number"
min="0"
class="form-control"
required>

</div>

</div>


<div class="modal-footer px-0 pb-0 mt-4">

<button
type="button"
class="btn btn-secondary rounded-pill"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-primary rounded-pill">

Save Product

</button>

</div>

</form>

</div>

</div>

</div>

</div>


<div id="toastContainer"></div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/static/script.js"></script>

</body>
</html>
