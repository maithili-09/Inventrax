<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management | Inventrax</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body class="admin-page">

<div id="adminNav"></div>

<main class="app-main">

    <div class="container-fluid px-lg-5">

        <div class="page-header">

            <div>

                <span class="eyebrow">
                    ADMINISTRATION
                </span>

                <h1>User Management</h1>

                <p>
                    Select a registered user to inspect their Inventrax activity.
                </p>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="search-panel">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    id="adminUserSearch"
                    type="search"
                    placeholder="Search users by email...">

            </div>

        </div>


        <div class="row g-4">

            <!-- USER LIST -->

            <div class="col-xl-5">

                <div class="data-card">

                    <div class="card-title-row">

                        <h4>Registered Users</h4>

                        <span id="userCount">
                            0 users
                        </span>

                    </div>

                    <div
                        id="userList"
                        class="user-list">
                    </div>

                </div>

            </div>


            <!-- USER DETAILS -->

            <div class="col-xl-7">

                <div
                    id="selectedUserPanel"
                    class="data-card user-detail-panel">

                    <div class="empty-state">

                        <i class="bi bi-person-vcard"></i>

                        <h4>Select a user</h4>

                        <p>
                            Choose a user from the list to view their account,
                            products, suppliers, purchase orders, sales and
                            low-stock information.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<div id="toastContainer"></div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/static/script.js"></script>

</body>

</html>
