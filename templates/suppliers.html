<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Suppliers | Inventrax</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div id="appNav"></div>

<main class="app-main">

<div class="container-fluid px-lg-5">

<div class="page-header">

<div>

<span class="eyebrow">SUPPLY NETWORK</span>

<h1>Suppliers</h1>

<p>Maintain your supplier directory in one place.</p>

</div>

<button
class="btn btn-primary rounded-pill"
data-bs-toggle="modal"
data-bs-target="#supplierModal">

<i class="bi bi-plus-lg me-2"></i>
Add Supplier

</button>

</div>


<div class="search-panel">

<div class="search-box">

<i class="bi bi-search"></i>

<input
id="supplierSearch"
type="search"
placeholder="Search suppliers, contact persons, emails or phone numbers...">

</div>

</div>


<div class="data-card">

<div class="table-responsive">

<table class="table modern-table">

<thead>

<tr>

<th>Supplier</th>
<th>Contact</th>
<th>Email</th>
<th>Phone</th>
<th>Address</th>

</tr>

</thead>

<tbody id="supplierTable"></tbody>

</table>

</div>

<div id="supplierPagination"
class="pagination-area">
</div>

</div>

</div>

</main>


<div class="modal fade"
id="supplierModal">

<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content dark-modal">

<div class="modal-header">

<h5>Add Supplier</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="supplierForm">

<div class="row g-3">

<div class="col-md-6">

<label>Supplier Name</label>

<input
id="supplierName"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Contact Person</label>

<input
id="supplierContact"
class="form-control">

</div>

<div class="col-md-6">

<label>Email</label>

<input
id="supplierEmail"
type="email"
class="form-control">

</div>

<div class="col-md-6">

<label>Phone</label>

<input
id="supplierPhone"
class="form-control">

</div>

<div class="col-12">

<label>Address</label>

<textarea
id="supplierAddress"
class="form-control"
rows="3"></textarea>

</div>

</div>

<div class="modal-footer px-0 pb-0 mt-4">

<button
type="button"
class="btn btn-secondary rounded-pill"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-primary rounded-pill">

Save Supplier

</button>

</div>

</form>

</div>

</div>

</div>

</div>


<div id="toastContainer"></div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/static/script.js"></script>

</body>
</html>
